<!DOCTYPE html>
<html lang="pt-br">
  <link rel="stylesheet" href="style.css" />
  <!--carregar arquivo css-->
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@700&display=swap"
      rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--ajuste de tela em smartphones-->
    <title>PokeDEX</title>
    <!--titulo da aba da pagina-->
    <link rel="icon" type="image/png" href="../assets/pokeball.png" />
  </head>
  <body>
    <div class="pageContent">
      <div class="screen">
      <h2 id="name">Nome do Pokemon</h2>
      <img
        id="img_sprite_front_default"
        src="../assets/missingno.png"
        alt="Imagem do Pokemon"
      />
      </div>
      <div class="controls-container">
      
        <div class="dpad">
          <div class="dpad-btn dpad-up"></div>
          <button id="previous" class="dpad-btn dpad-left" onclick="previousPokemon()" aria-label="Pokémon Anterior"></button>
          <div class="dpad-btn dpad-center"></div>
          <button id="next" class="dpad-btn dpad-right" onclick="nextPokemon()" aria-label="Próximo Pokémon"></button>
          <div class="dpad-btn dpad-down"></div>
        </div>
      
        <div class="ab-buttons">
          <button class="btn-ab" id="button-b">B</button>
          <button class="btn-ab" id="button-a">A</button>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js" type="text/javascript"></script>
  <!--carregar arquivo js-->
</html>
